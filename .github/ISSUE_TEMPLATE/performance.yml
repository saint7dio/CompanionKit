name: Performance issue
description: Report reproducible CPU, GPU, energy, memory, animation, or timer-lifetime behavior.
title: "[Performance]: "
labels: [performance]
body:
  - type: textarea
    id: summary
    attributes:
      label: Observed behavior
      description: Describe the measurable or visible issue without including personal data.
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Conditions and reproduction
      description: Include CompanionKit revision, macOS version, hardware architecture, Veya state, timer/animation settings, and steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add Instruments observations or logs with private paths and data removed. Do not invent benchmarks.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, clipboard contents, credentials, and unrelated diagnostics.
          required: true
